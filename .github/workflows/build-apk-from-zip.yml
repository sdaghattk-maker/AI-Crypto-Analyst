name: Build AI Crypto Analyst APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AI-Crypto-Analyst-Binance.zip'
      - '.github/workflows/build-apk-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check ZIP file
        shell: bash
        run: |
          set -euo pipefail
          test -f AI-Crypto-Analyst-Binance.zip || {
            echo "ERROR: AI-Crypto-Analyst-Binance.zip is missing from the repository root."
            exit 1
          }
          unzip -t AI-Crypto-Analyst-Binance.zip

      - name: Extract Flutter project and detect its real root
        id: locate_project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir -p extracted
          unzip -q AI-Crypto-Analyst-Binance.zip -d extracted
          mapfile -t PUBSPECS < <(find extracted -type f -name pubspec.yaml \
            -not -path '*/.dart_tool/*' -not -path '*/build/*' | sort)
          if [[ ${#PUBSPECS[@]} -ne 1 ]]; then
            echo "ERROR: Expected exactly one Flutter project; found ${#PUBSPECS[@]}"
            printf '%s\n' "${PUBSPECS[@]:-<none>}"
            find extracted -maxdepth 5 -type f | sort | head -250
            exit 1
          fi
          PROJECT_DIR="$(realpath "$(dirname "${PUBSPECS[0]}")")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Flutter project root: $PROJECT_DIR"
          ls -la "$PROJECT_DIR" | head -80

      - name: Prepare Android platform only when missing
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f android/gradlew || ! -f android/app/src/main/AndroidManifest.xml ]]; then
            echo "Android platform files are incomplete; generating the Android platform."
            flutter create --platforms=android --project-name ai_crypto_analyst .
          else
            echo "Existing Android platform detected; preserving project configuration."
          fi

      - name: Ensure INTERNET permission
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST" || { echo "ERROR: $MANIFEST not found"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          permission = 'android.permission.INTERNET'
          if permission not in text:
              match = re.search(r'<manifest\b[^>]*>', text)
              if not match:
                  raise SystemExit("ERROR: <manifest> root tag not found")
              text = text[:match.end()] + '\n    <uses-permission android:name="android.permission.INTERNET" />' + text[match.end():]
              path.write_text(text, encoding="utf-8")
          if permission not in path.read_text(encoding="utf-8"):
              raise SystemExit("ERROR: INTERNET permission verification failed")
          print("INTERNET permission verified in manifest.")
          PY

      - name: Remove default template test
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: flutter pub get

      - name: Analyze project (warnings and infos are non-fatal)
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -uo pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$GITHUB_WORKSPACE/flutter-analyze.log"
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            echo "ERROR: Flutter analyzer failed (exit $status). See flutter-analyze.log artifact."
            exit "$status"
          fi

      - name: Build release APK with full Gradle diagnostics
        id: gradle_build
        working-directory: ${{ steps.locate_project.outputs.project_dir }}/android
        shell: bash
        run: |
          set -uo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --console=plain \
            --stacktrace \
            --warning-mode all \
            -x lint \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease \
            -x lintVitalRelease \
            -x lintAnalyzeRelease \
            -x lintReportRelease \
            -x lintRelease \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            echo "ERROR: Gradle assembleRelease failed (exit $status). Key failure context:"
            grep -n -A 12 -B 5 -E '^\* What went wrong:|^Execution failed for task|^Caused by:|^FAILURE:' "$GITHUB_WORKSPACE/gradle-build.log" | tail -160 || true
            exit "$status"
          fi

      - name: Locate and verify release APK
        if: success()
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build/app/outputs -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [[ -z "$APK" ]]; then
            APK="$(find android/app/build/outputs -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$APK" ]]; then
            echo "ERROR: No release APK found in expected Flutter/Gradle output directories."
            find . -type f -name '*.apk' -print || true
            exit 1
          fi
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -o -name aapt2 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$AAPT" ]]; then
            echo "ERROR: aapt/aapt2 was not found."
            exit 1
          fi
          "$AAPT" dump permissions "$APK" | tee "$GITHUB_WORKSPACE/apk-permissions.txt"
          grep -Fq 'android.permission.INTERNET' "$GITHUB_WORKSPACE/apk-permissions.txt" || {
            echo "ERROR: INTERNET permission missing from final APK"
            exit 1
          }
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/AI-Crypto-Analyst.apk"
          ls -lh "$GITHUB_WORKSPACE/artifacts/AI-Crypto-Analyst.apk"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Crypto-Analyst-Build-Diagnostics
          path: |
            gradle-build.log
            flutter-analyze.log
            apk-permissions.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Crypto-Analyst-APK
          path: artifacts/AI-Crypto-Analyst.apk
          if-no-files-found: error
          retention-days: 14
