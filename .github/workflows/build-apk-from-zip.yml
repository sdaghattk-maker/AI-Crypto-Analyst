name: Build AI Crypto Analyst APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AI-Crypto-Analyst-Binance.zip'
      - '.github/workflows/build-apk-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check ZIP file
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/AI-Crypto-Analyst-Binance.zip"
          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ERROR: AI-Crypto-Analyst-Binance.zip is missing from the repository root."
            exit 1
          fi
          unzip -t "$ZIP_FILE"

      - name: Extract Flutter project and detect its real root
        id: locate_project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q "$GITHUB_WORKSPACE/AI-Crypto-Analyst-Binance.zip" -d "$GITHUB_WORKSPACE/extracted"

          mapfile -t PUBSPECS < <(find "$GITHUB_WORKSPACE/extracted" -type f -name pubspec.yaml \
            -not -path '*/.dart_tool/*' -not -path '*/build/*' | sort)

          if [[ ${#PUBSPECS[@]} -eq 0 ]]; then
            echo "ERROR: No pubspec.yaml was found in the ZIP archive."
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 5 -type f | sort | head -250
            exit 1
          fi
          if [[ ${#PUBSPECS[@]} -ne 1 ]]; then
            echo "ERROR: Expected exactly one Flutter project, found ${#PUBSPECS[@]}."
            printf '%s\n' "${PUBSPECS[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${PUBSPECS[0]}")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "Flutter project root: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          test -f "$PROJECT_DIR/pubspec.yaml"

      - name: Prepare Android platform (preserve existing configuration)
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f android/gradlew || ! -f android/app/build.gradle && ! -f android/app/build.gradle.kts ]]; then
            echo "Android platform is missing or incomplete; generating it."
            if [[ -d android ]]; then
              mv android "android.backup.$(date +%s)"
            fi
            flutter create --platforms=android --project-name ai_crypto_analyst .
          else
            echo "Existing Android platform detected; preserving its configuration."
          fi
          test -f android/app/src/main/AndroidManifest.xml

      - name: Ensure INTERNET permission
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          permission = 'android.permission.INTERNET'
          if permission not in content:
              match = re.search(r'<manifest\b[^>]*>', content)
              if not match:
                  raise SystemExit("ERROR: <manifest> opening tag not found")
              insertion = '\n    <uses-permission android:name="android.permission.INTERNET" />'
              content = content[:match.end()] + insertion + content[match.end():]
              manifest.write_text(content, encoding="utf-8")
          if permission not in manifest.read_text(encoding="utf-8"):
              raise SystemExit("ERROR: INTERNET permission verification failed")
          print("INTERNET permission verified.")
          PY
          cat "$MANIFEST"

      - name: Remove default template test
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: flutter pub get

      # Analyzer diagnostics are retained for review, but the Android compiler
      # remains the hard gate. Real Dart compilation failures still fail Gradle.
      - name: Analyze project (diagnostic; compiler is the build gate)
        id: analyze
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$GITHUB_WORKSPACE/analyze.log"
          ANALYZE_STATUS=${PIPESTATUS[0]}
          set -e
          echo "analyze_exit_code=$ANALYZE_STATUS" >> "$GITHUB_OUTPUT"
          if [[ "$ANALYZE_STATUS" -eq 0 ]]; then
            echo "Flutter analyzer completed without fatal diagnostics."
          else
            echo "::warning::flutter analyze returned exit code $ANALYZE_STATUS. See analyze.log; APK compilation will determine whether errors block the build."
          fi

      - name: Build release APK
        working-directory: ${{ steps.locate_project.outputs.project_dir }}/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease \
            -x lintVitalRelease \
            --no-daemon \
            --stacktrace

      - name: Locate and verify release APK
        id: verify_apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find "$PROJECT_DIR" -type f -path '*/outputs/apk/*/*.apk' -print | sort)
          if [[ ${#APKS[@]} -eq 0 ]]; then
            echo "ERROR: No APK found under outputs/apk."
            find "$PROJECT_DIR" -type f -name '*.apk' -print | sort
            exit 1
          fi
          APK=""
          for candidate in "${APKS[@]}"; do
            if [[ "$candidate" == *"/release/"* ]]; then APK="$candidate"; break; fi
          done
          if [[ -z "$APK" ]]; then APK="${APKS[0]}"; fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt -print 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$AAPT" ]]; then
            echo "ERROR: aapt tool was not found under $SDK_ROOT/build-tools"
            exit 1
          fi
          "$AAPT" dump permissions "$APK" | tee "$GITHUB_WORKSPACE/permissions.txt"
          grep -Fq 'android.permission.INTERNET' "$GITHUB_WORKSPACE/permissions.txt" || {
            echo "ERROR: INTERNET permission is missing from final APK"
            exit 1
          }
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/AI-Crypto-Analyst.apk"
          ls -lh "$GITHUB_WORKSPACE/artifacts/AI-Crypto-Analyst.apk"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Crypto-Analyst-APK
          path: artifacts/AI-Crypto-Analyst.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Crypto-Analyst-Build-Diagnostics
          path: |
            analyze.log
            permissions.txt
          if-no-files-found: ignore
          retention-days: 14
