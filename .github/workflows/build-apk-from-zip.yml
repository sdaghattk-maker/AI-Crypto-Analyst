name: Build AI Crypto Analyst APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AI-Crypto-Analyst-Binance.zip'
      - '.github/workflows/build-apk-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check ZIP file
        shell: bash
        run: |
          set -euo pipefail
          test -f AI-Crypto-Analyst-Binance.zip || {
            echo "ERROR: AI-Crypto-Analyst-Binance.zip is missing from the repository root."
            exit 1
          }
          unzip -t AI-Crypto-Analyst-Binance.zip

      - name: Extract Flutter project and detect its real root
        id: locate_project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir -p extracted
          unzip -q AI-Crypto-Analyst-Binance.zip -d extracted

          echo "Searching extracted archive for pubspec.yaml..."
          mapfile -t PUBSPECS < <(find extracted -type f -name pubspec.yaml \
            -not -path '*/.dart_tool/*' -not -path '*/build/*' | sort)

          if [[ ${#PUBSPECS[@]} -eq 0 ]]; then
            echo "ERROR: No pubspec.yaml was found in the ZIP archive."
            echo "Extracted file listing (first 250 entries):"
            find extracted -maxdepth 5 -type f | sort | head -250
            exit 1
          fi

          if [[ ${#PUBSPECS[@]} -gt 1 ]]; then
            echo "ERROR: Multiple Flutter projects were found; refusing to choose an arbitrary project."
            printf '%s\n' "${PUBSPECS[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${PUBSPECS[0]}")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "Flutter project root detected: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          test -f "$PROJECT_DIR/pubspec.yaml"
          ls -la "$PROJECT_DIR" | head -80

      - name: Generate Android platform files
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          flutter create --platforms=android --project-name ai_crypto_analyst .

      - name: Ensure INTERNET permission
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [[ ! -f "$MANIFEST" ]]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          permission = 'android.permission.INTERNET'
          if permission not in content:
              marker = '<application'
              if marker not in content:
                  raise SystemExit("ERROR: <application> tag not found")
              content = content.replace(
                  marker,
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n\n    ' + marker,
                  1,
              )
              manifest.write_text(content, encoding="utf-8")
          if permission not in manifest.read_text(encoding="utf-8"):
              raise SystemExit("ERROR: INTERNET permission verification failed")
          print("INTERNET permission verified.")
          PY
          cat "$MANIFEST"

      - name: Remove default template test
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: flutter pub get

      - name: Analyze project
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK without broken Lint task
        working-directory: ${{ steps.locate_project.outputs.project_dir }}/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease \
            -x lintVitalRelease \
            --no-daemon

      - name: Locate and verify release APK
        id: verify_apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -euo pipefail
          echo "Searching for release APK under: $PROJECT_DIR"
          find "$PROJECT_DIR" -type f -name '*.apk' -print | sort
          APK="$(find "$PROJECT_DIR" -type f -name 'app-release.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "ERROR: Release APK was not found"
            exit 1
          fi
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [[ -z "$AAPT" ]]; then
            echo "ERROR: aapt tool was not found"
            exit 1
          fi
          "$AAPT" dump permissions "$APK" | tee permissions.txt
          grep -Fq "android.permission.INTERNET" permissions.txt || {
            echo "ERROR: INTERNET permission is missing from final APK"
            exit 1
          }
          mkdir -p artifacts
          cp "$APK" artifacts/AI-Crypto-Analyst.apk
          echo "apk_path=$GITHUB_WORKSPACE/artifacts/AI-Crypto-Analyst.apk" >> "$GITHUB_OUTPUT"
          ls -lh artifacts/AI-Crypto-Analyst.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Crypto-Analyst-APK
          path: artifacts/AI-Crypto-Analyst.apk
          if-no-files-found: error
          retention-days: 14
