
name: Build AI Crypto Analyst APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AI-Crypto-Analyst-Binance.zip'
      - '.github/workflows/build-apk-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check ZIP file
        run: |
          set -e
          test -f AI-Crypto-Analyst-Binance.zip
          unzip -t AI-Crypto-Analyst-Binance.zip

      - name: Extract Flutter project
        run: |
          set -e
          mkdir -p extracted
          unzip -o AI-Crypto-Analyst-Binance.zip -d extracted
          test -f extracted/AI-Crypto-Analyst/pubspec.yaml

      - name: Generate Android platform files
        working-directory: extracted/AI-Crypto-Analyst
        run: |
          set -e
          rm -rf android
          flutter create --platforms=android --project-name ai_crypto_analyst .

      - name: Ensure INTERNET permission
        working-directory: extracted/AI-Crypto-Analyst
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [[ ! -f "$MANIFEST" ]]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")

          permission = 'android.permission.INTERNET'

          if permission not in content:
              marker = '<application'

              if marker not in content:
                  raise SystemExit("ERROR: <application> tag not found")

              content = content.replace(
                  marker,
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n\n    ' + marker,
                  1
              )

              manifest.write_text(content, encoding="utf-8")
              print("INTERNET permission added.")
          else:
              print("INTERNET permission already exists.")

          if permission not in manifest.read_text(encoding="utf-8"):
              raise SystemExit("ERROR: INTERNET permission verification failed")
          PY

          echo "Final AndroidManifest.xml:"
          cat "$MANIFEST"

      - name: Remove default template test
        working-directory: extracted/AI-Crypto-Analyst
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        working-directory: extracted/AI-Crypto-Analyst
        run: flutter pub get

      - name: Analyze project
        working-directory: extracted/AI-Crypto-Analyst
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK without broken Lint task
        working-directory: extracted/AI-Crypto-Analyst/android
        run: |
          set -e
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease \
            -x lintVitalRelease \
            --no-daemon

      - name: Locate and verify release APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="extracted/AI-Crypto-Analyst"

          echo "Searching for release APK..."
          find "$PROJECT" -type f -name '*.apk' -print | sort

          APK="$(find "$PROJECT" -type f -name '*.apk' \
            \( -name '*release*.apk' -o -path '*/flutter-apk/*.apk' \) \
            -print -quit)"

          if [[ -z "$APK" ]]; then
            echo "ERROR: Release APK was not found"
            exit 1
          fi

          AAPT="$(find "$ANDROID_HOME/build-tools" \
            -type f -name aapt | sort -V | tail -n 1)"

          if [[ -z "$AAPT" ]]; then
            echo "ERROR: aapt tool was not found"
            exit 1
          fi

          echo "Checking permissions inside final APK..."

          "$AAPT" dump permissions "$APK" | tee permissions.txt

          if ! grep -Fq "android.permission.INTERNET" permissions.txt; then
            echo "ERROR: INTERNET permission is missing from final APK"
            exit 1
          fi

          echo "SUCCESS: INTERNET permission exists in final APK."

          mkdir -p artifacts
          cp "$APK" artifacts/AI-Crypto-Analyst.apk

          echo "Selected APK: $APK"
          ls -lh artifacts/AI-Crypto-Analyst.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Crypto-Analyst-APK
          path: artifacts/AI-Crypto-Analyst.apk
          if-no-files-found: error
          retention-days: 14
