name: Build AI Crypto Analyst APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AI-Crypto-Analyst-Binance.zip'
      - '.github/workflows/build-apk-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check ZIP file
        run: |
          test -f AI-Crypto-Analyst-Binance.zip
          unzip -t AI-Crypto-Analyst-Binance.zip

      - name: Extract Flutter project
        run: |
          mkdir -p extracted
          unzip -o AI-Crypto-Analyst-Binance.zip -d extracted
          test -f extracted/AI-Crypto-Analyst/pubspec.yaml

      - name: Generate Android platform files
        working-directory: extracted/AI-Crypto-Analyst
        run: |
          rm -rf android
          flutter create --platforms=android --project-name ai_crypto_analyst .

      - name: Remove default template test
        working-directory: extracted/AI-Crypto-Analyst
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        working-directory: extracted/AI-Crypto-Analyst
        run: flutter pub get

      - name: Analyze project
        working-directory: extracted/AI-Crypto-Analyst
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK without broken Lint task
        working-directory: extracted/AI-Crypto-Analyst/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease \
            -x lintVitalRelease \
            --no-daemon

      - name: Locate and stage release APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="extracted/AI-Crypto-Analyst"
          echo "Searching all build output folders for release APKs..."
          find "$PROJECT" -type f -name '*.apk' -print | sort

          APK="$(find "$PROJECT" -type f -name '*.apk' \
            \( -name '*release*.apk' -o -path '*/flutter-apk/*.apk' \) \
            -print -quit)"

          if [[ -z "$APK" ]]; then
            echo "ERROR: Release APK was not found. Full APK search results:"
            find "$PROJECT" -type f -name '*.apk' -print
            exit 1
          fi

          mkdir -p artifacts
          cp "$APK" artifacts/AI-Crypto-Analyst.apk
          echo "Selected APK: $APK"
          ls -lh artifacts/AI-Crypto-Analyst.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Crypto-Analyst-APK
          path: artifacts/AI-Crypto-Analyst.apk
          if-no-files-found: error
          retention-days: 14
